<!DOCTYPE html>

        body { font-family: 'Inter', sans-serif; }
        .title-font { font-family: 'Playfair Display', serif; }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;

        @media (min-width: 640px)  { .gallery-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1024px) { .gallery-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 1280px) { .gallery-grid { grid-template-columns: repeat(5, 1fr); } }

    <!-- ═══════════════════════════════════════════════════════
         SINGLE SCRIPT — all JS in one place, no duplicates
    ═══════════════════════════════════════════════════════ -->
    <script>
        // ── Config ──────────────────────────────────────────
        const SUPABASE_URL = "https://jlhknihfcyncrseqctqu.supabase.co/rest/v1/";
        const SUPABASE_KEY = "sb_publishable_-XuJ12E83kQMSOF4K5QHHA_Y3eUjNi_";

        // ── State ────────────────────────────────────────────
        let currentUser  = null;
        let items        = [];
        let currentItemId = null;
        let selectedItems = new Set();
        let isSelectMode  = false;
        let activeFilters = [];
        let activeStatusFilter = null; // 'unlocked', 'locked', or null
        let currentSort   = "date-desc";
        let randomOrder   = [];
        let sortMenuOpen   = false;

        // ── Helpers ──────────────────────────────────────────
        function generateId() {
            return 'item_' + Date.now() + Math.random().toString(36).substr(2, 5);
        }

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.classList.remove('hidden');
        }

        function hideError(elementId) {
            document.getElementById(elementId).classList.add('hidden');
        }

        // ── Password hashing (Web Crypto, SHA-256 + salt) ────
        async function hashPassword(password, salt) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password + salt);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ── Auth: Signup ─────────────────────────────────────
        async function signup() {
            hideError('signup-error');
            const nickname = document.getElementById('signup-nickname').value.trim();
            const password = document.getElementById('signup-password').value.trim();

            if (!nickname || !password) {
                return showError('signup-error', 'Nickname and password are required.');
            }
            if (password.length < 4) {
                return showError('signup-error', 'Password must be at least 4 characters.');
            }

            try {
                const salt = btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));
                const hash = await hashPassword(password, salt);

                const res = await fetch(SUPABASE_URL + "users", {
                    method: "POST",
                    headers: sbHeaders({
                        "Content-Type": "application/json",
                        "Prefer": "return=representation"
                    }),
                    body: JSON.stringify({ nickname, password_hash: hash, salt })
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    // Unique constraint violation = duplicate nickname
                    if (res.status === 409 || (err.code && err.code === '23505')) {
                        return showError('signup-error', 'That nickname is already taken.');
                    }
                    return showError('signup-error', 'Signup failed. Please try again.');
                }

                alert('Account created! You can now log in.');
                document.getElementById('signup-nickname').value = '';
                document.getElementById('signup-password').value = '';
                showLogin();
            } catch (e) {
                console.error(e);
                showError('signup-error', 'Network error. Please try again.');
            }
        }

        // ── Auth: Login ──────────────────────────────────────
        async function login() {
            hideError('login-error');
            const nickname = document.getElementById('login-nickname').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!nickname || !password) {
                return showError('login-error', 'Nickname and password are required.');
            }

            try {
                const res = await fetch(
                    SUPABASE_URL + `users?nickname=eq.${encodeURIComponent(nickname)}`, {
                    headers: sbHeaders()
                });

                if (!res.ok) return showError('login-error', 'Login failed. Please try again.');

                const users = await res.json();
                if (users.length === 0) return showError('login-error', 'User not found.');

                const user = users[0];
                const hash = await hashPassword(password, user.salt);

                if (hash !== user.password_hash) return showError('login-error', 'Incorrect password.');

                currentUser = user;
                localStorage.setItem('lg_user', JSON.stringify(user));
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('login-password').value = '';

                await initializeApp();

            } catch (e) {
                console.error(e);
                showError('login-error', 'Network error. Please try again.');
            }
        }

        // ── Auth: Logout ─────────────────────────────────────
        function logout() {
            if (!confirm('Log out?')) return;
            currentUser = null;
            items = [];
            randomOrder = [];
            localStorage.removeItem('lg_user');
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('login-password').value = '';
            document.getElementById('login-nickname').value = '';

        // ── Screen switching ─────────────────────────────────
        function showSignup() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('signup-screen').classList.remove('hidden');
        }

        // ── App init after login ─────────────────────────────
        async function initializeApp() {
            document.getElementById('main-app').classList.remove('hidden');
            await loadItems();
            navigateTo('gallery');
            renderGallery();
        }

        // ── Supabase: Central headers builder ───────────────
        // Includes x-user-nickname on every request so RLS policies
        // can verify the caller matches the row they're touching.
        function sbHeaders(extra = {}) {
            const h = {
                "apikey": SUPABASE_KEY,
                "Authorization": `Bearer ${SUPABASE_KEY}`,
                ...extra
            };
            if (currentUser?.nickname) {
                h["x-user-nickname"] = currentUser.nickname;
            }
            return h;
        }

        // ── Supabase: Load items ─────────────────────────────
        async function loadItems() {
            if (!currentUser) return;
            try {
                const res = await fetch(
                    `${SUPABASE_URL}lust_items?user_nickname=eq.${encodeURIComponent(currentUser.nickname)}`, {
                    headers: sbHeaders()
                });
                const data = await res.json();

                if (data.length > 0) {
                    items = data[0].data || [];
                } else {
                    // First time for this user — create their row
                    await fetch(`${SUPABASE_URL}lust_items`, {
                        method: "POST",
                        headers: sbHeaders({ "Content-Type": "application/json" }),
                        body: JSON.stringify({
                            user_nickname: currentUser.nickname,
                            data: [],
                            updated_at: new Date().toISOString()
                        })
                    });
                    items = [];
                }
            } catch (e) {
                console.error(e);
                alert('Failed to load your collection.');
            }
        }

        // ── Supabase: Save items ─────────────────────────────
        async function saveItems() {
            if (!currentUser) return;
            try {
                await fetch(
                    `${SUPABASE_URL}lust_items?user_nickname=eq.${encodeURIComponent(currentUser.nickname)}`, {
                    method: "PATCH",
                    headers: sbHeaders({
                        "Content-Type": "application/json",
                        "Prefer": "return=representation"
                    }),
                    body: JSON.stringify({ data: items, updated_at: new Date().toISOString() })
                });
            } catch (e) {
                console.error(e);
                alert('Failed to save changes.');
            }
        }

        // ── Input parser ─────────────────────────────────────
        function parseInput(text, genres) {
            const blocks = text.trim().split('%red%').filter(b => b.trim());
            const newItems = [];

            blocks.forEach(block => {
                const lines = block.trim().split('\n').filter(l => l.trim());
                if (lines.length < 2) return;

                let nameLine = lines[0].replace(' -%%', '').trim();
                const link = lines[1].trim();
                let imageUrl = '';

                for (let line of lines) {
                    const match = line.match(/https?:\/\/[^\s"')]+/);
                    if (match) {
                        const url = match[0];
                        if (url.match(/\.(jpg|jpeg|png|webp|gif|avif)$/i) ||
                            url.includes('postimg.cc') ||
                            url.includes('8upload.com')) {
                            imageUrl = url;
                            break;
                        }
                    }
                }

                if (!imageUrl) {
                    console.warn('⚠️ No image URL found for:', nameLine);
                    return;
                }

                newItems.push({
                    id: generateId(),
                    name: nameLine,
                    activeLink: link,
                    source: link,
                    originalLink: link,
                    imageUrl,
                    genres: genres ? genres.split(',').map(g => g.trim().toLowerCase()).filter(Boolean) : [],
                    created: new Date().toISOString(),
                    views: 0
                });
            });
            return newItems;
        }

        // ── Process add-page input ───────────────────────────
        async function processInput() {
            const genres  = document.getElementById('genres-input').value.trim();
            const content = document.getElementById('content-input').value.trim();

            if (!content) return alert('Please paste content first.');

            const newItems = parseInput(content, genres);
            const existingLinks = new Set(items.map(i => i.originalLink));
            const unique = newItems.filter(i => !existingLinks.has(i.originalLink));

            if (unique.length === 0) return alert('All items already exist in your grid.');

            items = [...unique, ...items];
            await saveItems();

            document.getElementById('genres-input').value  = '';
            document.getElementById('content-input').value = '';

            alert(`${unique.length} new item(s) added!`);
            navigateTo('gallery');
            renderGallery();
        }

        // ── Gallery render ───────────────────────────────────
        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';

            // Step 1: apply active filters
            const isUnlockedItem = item => item.originalLink && item.source && item.originalLink !== item.source;
            let toRender = [...items];
            if (activeStatusFilter === 'unlocked') toRender = toRender.filter(isUnlockedItem);
            if (activeStatusFilter === 'locked')   toRender = toRender.filter(i => !isUnlockedItem(i));
            if (activeFilters.length) toRender = toRender.filter(item => (item.genres || []).some(g => activeFilters.includes(g)));

            // Step 2: apply current sort
            if (currentSort === 'random') {
                toRender = randomOrder.filter(item => {
                    if (activeStatusFilter === 'unlocked' && !isUnlockedItem(item)) return false;
                    if (activeStatusFilter === 'locked'   &&  isUnlockedItem(item)) return false;
                    if (activeFilters.length) return (item.genres || []).some(g => activeFilters.includes(g));
                    return true;
                });
            } else if (currentSort === 'recommended' || currentSort === 'recommended-asc') {
                // scores are already on item._recScore from sortGallery; just re-sort toRender
                if (currentSort === 'recommended') {
                    toRender.sort((a, b) => (b._recScore || 0) - (a._recScore || 0));
                } else {
                    toRender.sort((a, b) => (a._recScore || 0) - (b._recScore || 0));
                }
            } else {
                if (currentSort === 'date-desc')   toRender.sort((a, b) => new Date(b.created) - new Date(a.created));
                if (currentSort === 'date-asc')    toRender.sort((a, b) => new Date(a.created) - new Date(b.created));
                if (currentSort === 'opened-desc') toRender.sort((a, b) => new Date(b.lastOpened || 0) - new Date(a.lastOpened || 0));
                if (currentSort === 'opened-asc')  toRender.sort((a, b) => new Date(a.lastOpened || 0) - new Date(b.lastOpened || 0));
                if (currentSort === 'views-desc')  toRender.sort((a, b) => (b.views || 0) - (a.views || 0));
                if (currentSort === 'views-asc')   toRender.sort((a, b) => (a.views || 0) - (b.views || 0));
                if (currentSort === 'name-asc')    toRender.sort((a, b) => a.name.localeCompare(b.name));
                if (currentSort === 'name-desc')   toRender.sort((a, b) => b.name.localeCompare(a.name));
            }

            document.getElementById('item-count').textContent = `${toRender.length} items`;
            const unlocked = items.filter(i => i.originalLink && i.source && i.originalLink !== i.source).length;
            document.getElementById('unlocked-count').textContent = `unlocked ${unlocked}/${items.length}`;

            toRender.forEach(item => {
                const isSelected = selectedItems.has(item.id);
                const div = document.createElement('div');
                const isUnlocked = item.originalLink && item.source && item.originalLink !== item.source;
                div.className = `relative group rounded-3xl overflow-hidden cursor-pointer`;
                if (isSelected) {
                    div.style.boxShadow = '0 0 0 4px #f43f5e';
                } else if (isUnlocked) {
                    div.style.boxShadow = '0 0 0 1.5px rgba(192,132,252,0.9), 0 0 10px 3px rgba(192,132,252,0.25)';
                } else {
                    div.style.boxShadow = '0 0 0 1.5px rgba(161,161,170,0.5), 0 0 10px 3px rgba(161,161,170,0.1)';
                }
                div.innerHTML = `
                    <img src="${item.imageUrl}" class="w-full aspect-[4/5] object-cover" alt="${item.name}">
                    <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 to-transparent p-4">
                        <p class="font-medium line-clamp-2 text-sm">${item.name}</p>
                    </div>
                    ${isSelectMode ? `
                    <div onclick="event.stopImmediatePropagation(); toggleSelectItem('${item.id}');"
                         class="absolute top-3 right-3 w-7 h-7 rounded-2xl border-2 flex items-center justify-center transition-all ${isSelected ? 'bg-rose-500 border-rose-500' : 'border-white/70 bg-black/40'}">
                        ${isSelected ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                    </div>` : ''}
                `;
                div.onclick = () => isSelectMode ? toggleSelectItem(item.id) : viewDetail(item.id);
                grid.appendChild(div);
            });
        }

        // ── Sort & Filter ────────────────────────────────────
        function toggleSortDropdown() {
            const menu = document.getElementById('sort-menu');
            sortMenuOpen = !sortMenuOpen;
            menu.classList.toggle('hidden', !sortMenuOpen);
        }

        function sortGallery(val, restore = false) {
            // Close the dropdown
            document.getElementById('sort-menu').classList.add('hidden');
            sortMenuOpen = false;
            document.getElementById('reshuffle-btn').classList.toggle('hidden', val !== 'random');

            const isSame = !restore && val === currentSort;
            currentSort = val;

            let sorted = [...items];

            if (val === 'random') {
                // Always reshuffle — whether same or different
                randomOrder = [...items].sort(() => Math.random() - 0.5);
                sorted = randomOrder;
            } else if (isSame) {
                // Reverse by flipping the sort key
                const reverseMap = {
                    'recommended': 'recommended-asc', 'recommended-asc': 'recommended',
                    'date-desc': 'date-asc',     'date-asc': 'date-desc',
                    'opened-desc': 'opened-asc', 'opened-asc': 'opened-desc',
                    'views-desc': 'views-asc',   'views-asc': 'views-desc',
                    'name-asc': 'name-desc',     'name-desc': 'name-asc',
                };
                currentSort = reverseMap[val] || val;
            }

            // Apply the (possibly reversed) sort
            if (currentSort === 'recommended' || currentSort === 'recommended-asc') {
                const FALLBACK = new Date('2026-01-01').getTime();

                // Step 1: sort by views descending — most views = index 1 (best)
                // Ties share the same index
                const byViews = [...items].sort((a, b) => (b.views || 0) - (a.views || 0));
                const viewIndex = {};
                let vi = 1;
                for (let i = 0; i < byViews.length; i++) {
                    if (i > 0 && (byViews[i].views || 0) !== (byViews[i-1].views || 0)) vi = i + 1;
                    viewIndex[byViews[i].id] = vi;
                }
                const n = vi; // max view index
                // view_score: most views → index 1 → score (n - 1 + 1)/n = 1 (highest)
                // few views  → index n → score 1/n (lowest)
                // formula: (n - index + 1) / n
                const viewScore = id => (n - viewIndex[id] + 1) / n;

                // Step 2: sort by lastOpened — oldest = index m (best, "neglected")
                // most recently opened = index 1 (lowest recency score)
                const byOpened = [...items].sort((a, b) => {
                    const ta = a.lastOpened ? new Date(a.lastOpened).getTime() : FALLBACK;
                    const tb = b.lastOpened ? new Date(b.lastOpened).getTime() : FALLBACK;
                    return tb - ta; // descending: most recent first → index 1
                });
                const openedIndex = {};
                byOpened.forEach((item, i) => openedIndex[item.id] = i + 1);
                const m = byOpened.length;
                // recency_score: opened longest ago → index m → score m/m = 1 (highest)
                // opened most recently → index 1 → score 1/m (lowest)
                // formula: index / m
                const recencyScore = id => openedIndex[id] / m;

                // Step 3 & 4: compute score and sort descending (higher score = earlier)
                sorted.forEach(item => {
                    item._recScore = viewScore(item.id) * 0.55 + recencyScore(item.id) * 0.45;
                });

                if (currentSort === 'recommended') {
                    sorted.sort((a, b) => b._recScore - a._recScore); // higher score first
                } else {
                    sorted.sort((a, b) => a._recScore - b._recScore); // reversed
                }
            }
            if (currentSort === 'date-desc')   sorted.sort((a, b) => new Date(b.created) - new Date(a.created));
            if (currentSort === 'date-asc')    sorted.sort((a, b) => new Date(a.created) - new Date(b.created));
            if (currentSort === 'opened-desc') sorted.sort((a, b) => new Date(b.lastOpened || 0) - new Date(a.lastOpened || 0));
            if (currentSort === 'opened-asc')  sorted.sort((a, b) => new Date(a.lastOpened || 0) - new Date(b.lastOpened || 0));
            if (currentSort === 'views-desc') sorted.sort((a, b) => (b.views || 0) - (a.views || 0));
            if (currentSort === 'views-asc')  sorted.sort((a, b) => (a.views || 0) - (b.views || 0));
            if (currentSort === 'name-asc')   sorted.sort((a, b) => a.name.localeCompare(b.name));
            if (currentSort === 'name-desc')  sorted.sort((a, b) => b.name.localeCompare(a.name));

            // Update the button label
            const labels = {
                'recommended': 'Recommended', 'recommended-asc': 'Recommended ↑',
                'date-desc': 'Newest',        'date-asc': 'Oldest',
                'opened-desc': 'Last Opened', 'opened-asc': 'First Opened',
                'views-desc': 'Most Viewed',  'views-asc': 'Least Viewed',
                'name-asc': 'Name A→Z',       'name-desc': 'Name Z→A',
                'random': 'Random',
            };
            document.getElementById('sort-label').textContent = labels[currentSort] || 'Sort';

            // Highlight the active option in the menu
            // Strip direction suffix so 'date-asc' still highlights the 'date-desc' option
            const baseSort = currentSort.replace(/-asc$|-desc$/, '');
            document.querySelectorAll('.sort-option').forEach(el => {
                const elBase = el.getAttribute('onclick').match(/'([^']+)'/)?.[1]?.replace(/-asc$|-desc$/, '') || '';
                el.classList.toggle('text-rose-400', elBase === baseSort);
            });

            renderGallery();
        }

        function reshuffleRandom() {
            randomOrder = [...items].sort(() => Math.random() - 0.5);
            renderGallery();
        }

        function toggleFilterModal() {
            const container = document.getElementById('filter-genres-list');
            container.innerHTML = '';

            // ── System filters (unlocked / locked) ──
            const divider = document.createElement('div');
            divider.className = 'text-xs text-zinc-500 uppercase tracking-widest px-2 pb-1 pt-1';
            divider.textContent = 'Status';
            container.appendChild(divider);

            [['unlocked', 'Unlocked'], ['locked', 'Locked']].forEach(([val, label]) => {
                const checked = activeStatusFilter === val;
                const row = document.createElement('div');
                row.className = 'flex items-center gap-3 py-3 px-2 hover:bg-zinc-800 rounded-2xl cursor-pointer';
                row.innerHTML = `
                    <input type="radio" name="status-filter" id="sf_${val}" value="${val}" ${checked ? 'checked' : ''} class="w-5 h-5 accent-purple-500">
                    <label for="sf_${val}" class="flex-1 cursor-pointer">${label}</label>
                `;
                container.appendChild(row);
            });

            // "Any" option to clear status filter
            const anyRow = document.createElement('div');
            anyRow.className = 'flex items-center gap-3 py-3 px-2 hover:bg-zinc-800 rounded-2xl cursor-pointer';
            anyRow.innerHTML = `
                <input type="radio" name="status-filter" id="sf_any" value="" ${!activeStatusFilter ? 'checked' : ''} class="w-5 h-5 accent-purple-500">
                <label for="sf_any" class="flex-1 cursor-pointer">Any</label>
            `;
            container.appendChild(anyRow);

            // ── Genre filters ──
            const allGenres = new Set();
            items.forEach(item => (item.genres || []).forEach(g => allGenres.add(g)));

            if (allGenres.size > 0) {
                const genreDivider = document.createElement('div');
                genreDivider.className = 'text-xs text-zinc-500 uppercase tracking-widest px-2 pb-1 pt-4';
                genreDivider.textContent = 'Genres';
                container.appendChild(genreDivider);

                allGenres.forEach(genre => {
                    const checked = activeFilters.includes(genre);
                    const div = document.createElement('div');
                    div.className = 'flex items-center gap-3 py-3 px-2 hover:bg-zinc-800 rounded-2xl cursor-pointer';
                    div.innerHTML = `
                        <input type="checkbox" id="g_${genre}" ${checked ? 'checked' : ''} class="w-5 h-5 accent-rose-500">
                        <label for="g_${genre}" class="flex-1 cursor-pointer">${genre}</label>
                    `;
                    container.appendChild(div);
                });
            }

            document.getElementById('filter-modal').classList.remove('hidden');
        }

        function applyFilters() {
            const statusRadio = document.querySelector('input[name="status-filter"]:checked');
            activeStatusFilter = statusRadio?.value || null;
            activeFilters = Array.from(document.querySelectorAll('#filter-genres-list input[type="checkbox"]:checked'))
                .map(cb => cb.id.replace('g_', ''));
            closeModals();
            renderGallery();
        }

        // ── Selection ────────────────────────────────────────
        function toggleSelectMode() {
            isSelectMode = !isSelectMode;
            selectedItems.clear();
            document.getElementById('selection-toolbar').classList.toggle('hidden', !isSelectMode);
            document.getElementById('import-btn').classList.toggle('hidden', isSelectMode);
            renderGallery();
        }

        function toggleSelectItem(id) {
            selectedItems.has(id) ? selectedItems.delete(id) : selectedItems.add(id);
            renderGallery();
        }

        function selectAll() { items.forEach(i => selectedItems.add(i.id)); renderGallery(); }

        function cancelSelection() {
            isSelectMode = false;
            selectedItems.clear();
            document.getElementById('selection-toolbar').classList.add('hidden');
            document.getElementById('import-btn').classList.remove('hidden');
            renderGallery();
        }

        function exportSelected() {
            if (!selectedItems.size) return;
            const dataStr = JSON.stringify(items.filter(i => selectedItems.has(i.id)), null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `lustgrid_export_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
        }

        async function deleteSelected() {
            if (!selectedItems.size || !confirm(`Delete ${selectedItems.size} item(s)?`)) return;
            items = items.filter(i => !selectedItems.has(i.id));
            await saveItems();
            cancelSelection();
        }

        function importJSON() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async ev => {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        imported.forEach(item => {
                            if (!item.id)     item.id      = generateId();
                            if (!item.created) item.created = new Date().toISOString();
                            if (typeof item.views !== 'number') item.views = 0;
                        });
                        items = [...imported, ...items];
                        await saveItems();
                        renderGallery();
                        alert(`${imported.length} items imported!`);
                    } catch (err) { alert('Invalid JSON file.'); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // ── Edit modals ──────────────────────────────────────
        function editLinks() {
            const item = items.find(i => i.id === currentItemId);
            if (!item) return;
            document.getElementById('edit-active').value   = item.activeLink   || '';
            document.getElementById('edit-source').value   = item.source       || '';
            document.getElementById('edit-original').value = item.originalLink || '';

            item.activeLink   = document.getElementById('edit-active').value.trim();
            item.source       = document.getElementById('edit-source').value.trim();

            closeModals();
            viewDetail(currentItemId);

            document.getElementById('edit-image-url').value = item.imageUrl || '';
            document.getElementById('image-modal').classList.remove('hidden');

            const item = items.find(i => i.id === currentItemId);
            if (!item) return;
            const newUrl = document.getElementById('edit-image-url').value.trim();
            if (!newUrl) return alert('Please enter a valid image URL.');
            item.imageUrl = newUrl;
            await saveItems();
            closeModals();
            viewDetail(currentItemId);
        }

        function editGenres() {
            const item = items.find(i => i.id === currentItemId);
            if (!item) return;
            document.getElementById('modal-genres-input').value = (item.genres || []).join(', ');
            document.getElementById('genres-modal').classList.remove('hidden');

        async function saveGenres() {
            const item = items.find(i => i.id === currentItemId);
            if (!item) return;
            item.genres = document.getElementById('modal-genres-input').value
                .split(',').map(g => g.trim().toLowerCase()).filter(Boolean);
            await saveItems();
            closeModals();
            viewDetail(currentItemId);
        }

        async function deleteCurrentItem() {
            if (!currentItemId || !confirm('Delete this item?')) return;
            items = items.filter(i => i.id !== currentItemId);
            await saveItems();
            backToGallery();
        }

        // ── Utility ──────────────────────────────────────────
        function copyField(id) {
            navigator.clipboard.writeText(document.getElementById(id).value);
        }

        function closeModals() {
            ['links-modal', 'genres-modal', 'filter-modal', 'image-modal']
                .forEach(id => document.getElementById(id).classList.add('hidden'));
        }

        // ── Keyboard shortcuts ───────────────────────────────
        document.addEventListener('click', e => {
            if (sortMenuOpen && !document.getElementById('sort-dropdown').contains(e.target)) {
                document.getElementById('sort-menu').classList.add('hidden');
                sortMenuOpen = false;
            }
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeModals();
                if (isSelectMode) cancelSelection();
                document.getElementById('sort-menu').classList.add('hidden');
                sortMenuOpen = false;
            }
        });

        // Auto-restore session from localStorage — re-verified against Supabase
        window.addEventListener('load', async () => {
            const saved = localStorage.getItem('lg_user');
            if (!saved) return;
            try {
                const parsed = JSON.parse(saved);
                if (!parsed.nickname || !parsed.password_hash || !parsed.salt) {
                    // Incomplete object — reject it
                    localStorage.removeItem('lg_user');
                    return;
                }
                // Re-fetch the user from Supabase and confirm the stored hash still matches
                const res = await fetch(
                    SUPABASE_URL + 'users?nickname=eq.' + encodeURIComponent(parsed.nickname), {
                    headers: sbHeaders()
                });
                const users = await res.json();
                if (!users.length) { localStorage.removeItem('lg_user'); return; }
                const dbUser = users[0];
                // Stored hash must match what's in the DB — rules out tampered objects
                if (dbUser.password_hash !== parsed.password_hash) {
                    localStorage.removeItem('lg_user');
                    return;
                }
                currentUser = dbUser;
                document.getElementById('login-screen').classList.add('hidden');
                await initializeApp();
            } catch (e) {
                localStorage.removeItem('lg_user');
            }
        });
    </script>
</body>
</html>
