name: Supabase Keep-Alive

# Pings the Supabase REST API on a schedule so the free-tier project
# never sits idle for 7 days and gets auto-paused.

on:
  schedule:
    # Every Sunday at 00:00 UTC. Well inside the 7-day pause window,
    # even accounting for occasional missed/delayed runs.
    - cron: "0 0 * * 0"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}items?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "Supabase responded with HTTP $response"

          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "Keep-alive ping succeeded."
          else
            echo "::error::Keep-alive ping failed with status $response"
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
